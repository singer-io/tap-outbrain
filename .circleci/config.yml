version: 2
jobs:
  build:
    docker:
      - image: 218546966473.dkr.ecr.us-east-1.amazonaws.com/circle-ci:stitch-tap-tester-uv
    steps:
      - checkout
      - run:
          name: 'Setup virtual env'
          command: |
            uv venv --python 3.12 /usr/local/share/virtualenvs/tap-outbrain
            source /usr/local/share/virtualenvs/tap-outbrain/bin/activate
            uv pip install -U pip setuptools
            uv pip install .[dev]
      - run:
         name: 'pylint'
         command: |
            source /usr/local/share/virtualenvs/tap-outbrain/bin/activate
            uv pip install pylint
            pylint tap_outbrain -d C,R,W
      - run:
          name: 'JSON Validator'
          command: |
            source /usr/local/share/virtualenvs/tap-tester/bin/activate
            stitch-validate-json tap_outbrain/schemas/*.json
      - add_ssh_keys
      - run:
          name: 'Unit Tests'
          command: |
            source /usr/local/share/virtualenvs/tap-outbrain/bin/activate
            uv pip install pytest coverage parameterized
            mkdir -p test_output
            coverage run -m pytest tests/unittests tests/mock_integration --junitxml=test_output/report.xml
            coverage xml -o coverage.xml
            coverage html
            coverage report -m --fail-under=99 | tee coverage.txt
          when: always
      - store_test_results:
          path: test_output/report.xml
      - store_artifacts:
          path: coverage.xml
      - store_artifacts:
          path: coverage.txt
      - store_artifacts:
          path: htmlcov
      - run:
          name: 'Integration Tests (Auto Mode)'
          command: |
            source /usr/local/share/virtualenvs/tap-tester/bin/activate
            uv pip install --upgrade awscli
            aws s3 cp s3://com-stitchdata-dev-deployment-assets/environments/tap-tester/tap_tester_sandbox dev_env.sh || true
            if [ -f dev_env.sh ]; then source dev_env.sh; fi
            source /usr/local/share/virtualenvs/tap-outbrain/bin/activate
            uv pip install pytest
            export STITCH_TAP_PATH=/usr/local/share/virtualenvs/tap-outbrain/bin/tap-outbrain
            python tests/run_integration_tests.py --mode auto
          when: always

workflows:
  version: 2
  commit:
    jobs:
      - build:
          context: circleci-user
  build_daily:
    triggers:
      - schedule:
          cron: "0 12 * * *"
          filters:
            branches:
              only:
                - master
    jobs:
      - build:
          context: circleci-user
